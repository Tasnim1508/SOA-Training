type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}

enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type Module {
    matricule: String
    nom: String
    coefficient: Int
    volumeHoraire: Int
    type: TypeModule
    uniteEnseignement: UniteEnseignement
}

type QueryResolver {
    allUEs: [UniteEnseignement]
    ueByCode(code: Int!): UniteEnseignement
    uesByDomaine(domaine: String!): [UniteEnseignement]
    uesBySemestre(semestre: Int!): [UniteEnseignement]

    allModules: [Module]
    modulesByType(type: TypeModule!): [Module]
    moduleByMatricule(matricule: String!): Module
}

type MutationResolver {
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    updateUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    deleteUniteEnseignement(code: Int!): Boolean

    addModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Boolean

    updateModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Module

    deleteModule(matricule: String!): String
}

schema {
    query: QueryResolver
    mutation: MutationResolver
}